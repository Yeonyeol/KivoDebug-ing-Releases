name: One-time approved v0.2.8 publication
'on':
  push:
    branches: [main]
    paths: [.github/workflows/publish-v028-once.yml]
permissions:
  contents: write
concurrency:
  group: kivo-v028-one-time-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'Yeonyeol/KivoDebug-ing-Releases' && github.event.head_commit.message == 'ci: retry approved v0.2.8 publication kivo-v028-20260907-91c7'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run the pinned reviewed transfer with corrected API URL normalization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, subprocess, textwrap
          endpoint = 'repos/Yeonyeol/KivoDebug-ing-Releases/contents/.github/workflows/publish-v028-once.yml?ref=4767cfefb216a69e7cabc9edde884f4cbd0ca673'
          response = subprocess.run(['gh', 'api', endpoint], check=True, capture_output=True)
          raw = base64.b64decode(json.loads(response.stdout)['content'])
          expected = 'c61e5ce5f8636209fb91cfd0c38b0f9e5c803424'
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != expected:
              raise RuntimeError('Pinned transfer script changed')
          body = raw.decode().split("          python3 - <<'PY'\n", 1)[1].rsplit('          PY\n', 1)[0]
          script = textwrap.dedent(body)
          old = 'url = "https://api.github.com/repos/" + REPO + "/" + path'
          new = 'url = ("https://api.github.com/repos/" + REPO + "/" + path).rstrip("/")'
          if script.count(old) != 1:
              raise RuntimeError('Unexpected API normalization patch target')
          script = script.replace(old, new)
          exec(compile(script, '<reviewed-v028-transfer>', 'exec'))
          PY
